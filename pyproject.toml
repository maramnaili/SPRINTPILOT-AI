[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintpilot-ai"
version = "0.1.0"
description = "An agentic AI assistant for software project planning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "langgraph>=0.2",
    "sqlalchemy>=2.0",
    "chromadb>=0.6",
    "streamlit>=1.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

